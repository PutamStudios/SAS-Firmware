name: Compile and Attach Firmware to Release

on:
  push:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: |
          pio run -e m5stack-cplus1_1

      - name: Rename Firmware Binary
        run: |
          cp .pio/build/m5stack-cplus1_1/firmware.bin ./SAS-m5stack-cplus1_1.bin

      - name: Upload Firmware to Release Assets
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./SAS-m5stack-cplus1_1.bin
          asset_name: SAS-m5stack-cplus1_1.bin
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
